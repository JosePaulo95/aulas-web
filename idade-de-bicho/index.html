<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Idade de Bicho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="caixa">
    <h1>🐾 Qual a sua idade de bicho?</h1>
    <p>Quantos anos você tem?</p>
    <input id="idade" type="number">

    <p>Escolha um animal:</p>
    <div class="botoes">
      <button onclick="calculaIdade('cachorro', 7, '🐕')">🐕 Cachorro</button>
      <button onclick="calculaIdade('coelho', 8, '🐇')">🐇 Coelho</button>
      <button onclick="calculaIdade('hamster', 30, '🐹')">🐹 Hamster</button>
      <button onclick="calculaIdade('cavalo', 3, '🐎')">🐎 Cavalo</button>
      <button onclick="calculaIdade('tartaruga', 0.5, '🐢')">🐢 Tartaruga</button>
    </div>

    <p id="resultado"></p>
    <ul id="historico"></ul>
  </div>

  <script src="codigo.js"></script>
</body>
</html>
