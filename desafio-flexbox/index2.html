<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desafio Flexbox</title>
  <style>
    /* Não mexa neste css! */

    body {
      margin: 0;
      padding: 1vw;
      height: 100vh;
      box-sizing: border-box;
      border-top: 1vmin solid #16a89c;
    }

    #tudo {
      gap: 1vw;
    }

    .container {
      display: flex;
      width: 23.5vw;
      height: 23.5vw;
      padding: 1.5vmin;
      box-sizing: border-box;
      background: #123047;
      border: 0.4vmin dashed #244056;
      border-radius: 1.5vmin;
    }

    .caixa {
      width: 4vw;
      height: 4vw;
      border-radius: 0.6vw;
    }

    .caixa:nth-child(1) { background: #8ccbff; }
    .caixa:nth-child(2) { background: #54a8ee; }
    .caixa:nth-child(3) { background: #3482cc; }
    .caixa:nth-child(4) { background: #24609f; }
  </style>

  <link rel="stylesheet" href="estil.css">
</head>
<body>
  <div id="tudo">
    <div class="container" id="c1">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c2">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c3">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c4">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c5">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c6">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c7">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>

    <div class="container" id="c8">
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
      <div class="caixa"></div>
    </div>
  </div>
</body>
</html>
